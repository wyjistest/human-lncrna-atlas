services:
  backend:
    # NOTE: /api/v1/admin/metrics is in-memory per process. For perf baselines we need
    # deterministic aggregation, so force a single worker to avoid samples being split
    # across multiple processes.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
