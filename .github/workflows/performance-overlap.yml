name: Performance Overlap

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label override (e.g. self-hosted). Empty = use repo variable CI_RUNS_ON or default ubuntu-latest."
        required: false
        default: ""
      backend_mode:
        description: "Where backend comes from: external (use api_base_url) | docker-sample (boot sample backend via docker compose)."
        required: false
        default: "external"
        type: choice
        options:
          - external
          - docker-sample
      api_base_url:
        description: "Backend base URL (e.g. http://127.0.0.1:8000)."
        required: false
        default: "http://127.0.0.1:8000"
      mode:
        description: "check (gate regressions) | generate-baseline (emit baseline json)."
        required: true
        default: "check"
        type: choice
        options:
          - check
          - generate-baseline
      warmup_rounds:
        description: "Warmup rounds before snapshot."
        required: false
        default: "80"
      pre_warmup_rounds:
        description: "Optional: pre-warmup rounds to warm caches. Recommended with reset_metrics=true."
        required: false
        default: "0"
      lncrna_gene_id:
        description: "Warmup lncRNA gene id."
        required: false
        default: "17276"
      species_ids:
        description: "Warmup compare species ids (CSV)."
        required: false
        default: "1,3"
      reset_metrics:
        description: "Optional: reset /api/v1/admin/metrics stats before warmup (external backend only)."
        required: false
        default: "false"
      min_samples:
        description: "Gate: minimum samples per endpoint (requests >= min_samples)."
        required: false
        default: "50"
      response_regression_pct:
        description: "Gate: response regression pct threshold."
        required: false
        default: "4"
      response_regression_abs_ms:
        description: "Gate: response regression abs threshold (ms)."
        required: false
        default: "2"
      db_regression_pct:
        description: "Gate: db regression pct threshold."
        required: false
        default: "4"
      db_regression_abs_ms:
        description: "Gate: db regression abs threshold (ms)."
        required: false
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_RUNS_ON: ${{ (github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
  BACKEND_MODE: ${{ github.event.inputs.backend_mode || 'external' }}
  API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://127.0.0.1:8000' }}
  MODE: ${{ github.event.inputs.mode || 'check' }}
  WARMUP_ROUNDS: ${{ github.event.inputs.warmup_rounds || '80' }}
  PRE_WARMUP_ROUNDS: ${{ github.event.inputs.pre_warmup_rounds || '0' }}
  LNCRNA_GENE_ID: ${{ github.event.inputs.lncrna_gene_id || '17276' }}
  SPECIES_IDS: ${{ github.event.inputs.species_ids || '1,3' }}
  RESET_METRICS: ${{ github.event.inputs.reset_metrics || 'false' }}
  MIN_SAMPLES: ${{ github.event.inputs.min_samples || '50' }}
  RESPONSE_REGRESSION_PCT: ${{ github.event.inputs.response_regression_pct || '4' }}
  RESPONSE_REGRESSION_ABS_MS: ${{ github.event.inputs.response_regression_abs_ms || '2' }}
  DB_REGRESSION_PCT: ${{ github.event.inputs.db_regression_pct || '4' }}
  DB_REGRESSION_ABS_MS: ${{ github.event.inputs.db_regression_abs_ms || '1' }}
  PYTHON_VERSION: '3.11'

jobs:
  overlap-perf:
    name: Overlap Perf Regression
    runs-on: ${{ (github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          git config --global http.sslVersion tlsv1.2
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout source via tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run overlap perf regression
        if: ${{ env.BACKEND_MODE == 'external' }}
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          python3 --version

          reset_args=()
          if [ "${RESET_METRICS}" = "true" ]; then
            reset_args=(--reset-metrics)
          fi

          python3 scripts/perf_overlap_regression.py "${MODE}" \
            --base-url "${API_BASE_URL}" \
            --baseline-raw-metrics-file "docs/baselines/performance/overlap-admin-metrics.baseline.raw.json" \
            "${reset_args[@]}" \
            --pre-warmup-rounds "${PRE_WARMUP_ROUNDS}" \
            --warmup-rounds "${WARMUP_ROUNDS}" \
            --lncrna-gene-id "${LNCRNA_GENE_ID}" \
            --species-ids "${SPECIES_IDS}" \
            --min-samples "${MIN_SAMPLES}" \
            --response-regression-pct "${RESPONSE_REGRESSION_PCT}" \
            --response-regression-abs-ms "${RESPONSE_REGRESSION_ABS_MS}" \
            --db-regression-pct "${DB_REGRESSION_PCT}" \
            --db-regression-abs-ms "${DB_REGRESSION_ABS_MS}"

      - name: Boot sample backend (docker compose) and run perf regression
        if: ${{ env.BACKEND_MODE == 'docker-sample' }}
        env:
          PRE_WARMUP_ROUNDS: ${{ env.WARMUP_ROUNDS }}
          RESET_METRICS: "true"
        run: |
          set -euo pipefail
          bash scripts/baselines/run_overlap_perf_regression_docker.sh

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: overlap-perf-${{ env.MODE }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            docs/reports/perf-overlap-*.md
            docs/reports/perf-overlap-*.json
            docs/baselines/performance/overlap-admin-metrics.baseline.json
            docs/baselines/performance/overlap-admin-metrics.baseline.raw.json
