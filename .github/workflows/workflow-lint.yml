name: Workflow Lint

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label override (e.g. self-hosted). Empty = use repo variable CI_RUNS_ON or default ubuntu-latest."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  contents: read

env:
  CI_RUNS_ON: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
  ACTIONLINT_VERSION: "1.7.10"

jobs:
  actionlint:
    name: actionlint
    # 注意：runs-on 不能引用 env.*（workflow 级 env 在此阶段不可用），需直接用表达式解析。
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Download repo tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Downloading tarball for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Checked out workspace from tarball."

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${ACTIONLINT_VERSION}"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="amd64" ;;
            aarch64) arch="arm64" ;;
            arm64) arch="arm64" ;;
            *)
              echo "::error::Unsupported architecture: ${arch}"
              exit 1
              ;;
          esac

          cache_root="${HOME}/.cache/hla-tools/actionlint"
          cache_dir="${cache_root}/${version}"
          cached_bin="${cache_dir}/actionlint"
          if [ -x "${cached_bin}" ]; then
            echo "Using cached actionlint: ${cached_bin}"
            install -m 0755 "${cached_bin}" "${RUNNER_TEMP}/actionlint"
            echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
            exit 0
          fi

          api="https://api.github.com"
          asset_name="actionlint_${version}_${os}_${arch}.tar.gz"
          tmp_dir="$(mktemp -d)"
          release_json="${tmp_dir}/release.json"

          auth=()
          if [ -n "${GH_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi

          curl -fsSL \
            "${auth[@]}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/repos/rhysd/actionlint/releases/tags/v${version}" \
            -o "$release_json"

          if command -v python3 >/dev/null 2>&1; then
            asset_id="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); name=sys.argv[2]; ids=[a.get("id") for a in data.get("assets", []) if a.get("name")==name]; print(ids[0]) if ids else sys.exit(1)' "$release_json" "$asset_name")"
          elif command -v python >/dev/null 2>&1; then
            asset_id="$(python -c 'import json,sys; data=json.load(open(sys.argv[1])); name=sys.argv[2]; ids=[a.get("id") for a in data.get("assets", []) if a.get("name")==name]; print(ids[0]) if ids else sys.exit(1)' "$release_json" "$asset_name")"
          elif command -v node >/dev/null 2>&1; then
            asset_id="$(node -e 'const fs=require(\"fs\");const p=process.argv[1];const n=process.argv[2];const d=JSON.parse(fs.readFileSync(p,\"utf8\"));const a=(d.assets||[]).find(x=>x.name===n);if(!a){process.exit(1);}process.stdout.write(String(a.id));' "$release_json" "$asset_name")"
          else
            echo "::error::Missing python/node to parse GitHub API response for actionlint release."
            exit 1
          fi

          if [ -z "${asset_id:-}" ]; then
            echo "::error::Failed to locate actionlint release asset: ${asset_name}"
            exit 1
          fi

          curl -fsSL -L \
            "${auth[@]}" \
            -H "Accept: application/octet-stream" \
            "${api}/repos/rhysd/actionlint/releases/assets/${asset_id}" \
            -o "${tmp_dir}/actionlint.tar.gz"

          tar -xzf "${tmp_dir}/actionlint.tar.gz" -C "$tmp_dir"

          install -m 0755 "${tmp_dir}/actionlint" "${RUNNER_TEMP}/actionlint"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

          # 尝试写入缓存（失败不影响 CI）
          if mkdir -p "${cache_dir}" 2>/dev/null; then
            install -m 0755 "${tmp_dir}/actionlint" "${cached_bin}" || true
          fi

      - name: Run actionlint
        run: |
          set -euo pipefail

          actionlint -version

          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows"
            exit 1
          fi

          actionlint "${files[@]}"
