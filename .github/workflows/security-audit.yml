# ============================================================================
# Security Audit Workflow
# Phase 9.20 - Codex Review Enhancement
# ============================================================================
# 运行依赖安全审计 (pip-audit + npm audit)
# 触发条件: main 分支依赖清单变化 push + 手动触发（workflow_dispatch）
#
# 安全说明: 此工作流不使用任何用户可控输入 (issue title, PR body 等)
# 所有变量均为 GitHub Actions 内部状态

name: Security Audit

on:
  # 默认在 main 分支依赖清单变化时自动触发（优先使用 self-hosted，避免 GitHub-hosted runner 受账单/额度限制阻塞）。
  # 注意：PR CI（pull_request）在 self-hosted 上存在“运行不受信任代码”的风险，默认不启用。
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-audit.yml"
      - "frontend/backend/requirements*.txt"
      - "frontend/backend/constraints.txt"
      - "scripts/paper/requirements.txt"
      - "frontend/web/package.json"
      - "frontend/web/package-lock.json"
  workflow_dispatch:  # 允许手动触发
    inputs:
      runs_on:
        description: "Runner label override (e.g. self-hosted). Empty = use repo variable CI_RUNS_ON or default ubuntu-latest."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  contents: read

env:
  # 解析后的 runs-on（用于 step 条件判断）
  CI_RUNS_ON: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}

jobs:
  # ============================================================================
  # Python 依赖安全审计
  # ============================================================================
  python-audit:
    name: Python Dependencies Audit
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend/backend

    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        working-directory: .
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Download repo tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Checkout repository
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements*.txt
            frontend/backend/constraints.txt
            scripts/paper/requirements.txt

      - name: Install pip-audit
        run: |
          pip_args=()
          if [ -n "${PIP_PROXY:-}" ]; then
            pip_args+=(--proxy "$PIP_PROXY")
          fi
          pip "${pip_args[@]}" install pip-audit -c constraints.txt

      - name: Run pip-audit
        run: |
          echo "::group::pip-audit results"
          backend_report="$(mktemp)"
          paper_report="$(mktemp)"
          if [ -n "${PIP_PROXY:-}" ]; then
            export HTTP_PROXY="${HTTP_PROXY:-${PIP_PROXY:-}}"
            export HTTPS_PROXY="${HTTPS_PROXY:-${PIP_PROXY:-}}"
            export http_proxy="${http_proxy:-${PIP_PROXY:-}}"
            export https_proxy="${https_proxy:-${PIP_PROXY:-}}"
          fi
          run_pip_audit_with_retry() {
            local attempt=1
            local max_attempts="${PIP_AUDIT_ATTEMPTS:-3}"
            local retry_delay_seconds="${PIP_AUDIT_RETRY_DELAY_SECONDS:-2}"
            local audit_timeout_seconds="${PIP_AUDIT_TIMEOUT:-8}"
            if ! [[ "$max_attempts" =~ ^[1-9][0-9]*$ ]]; then
              echo "PIP_AUDIT_ATTEMPTS must be a positive integer" >&2
              return 2
            fi
            if ! [[ "$retry_delay_seconds" =~ ^[0-9]+$ ]]; then
              echo "PIP_AUDIT_RETRY_DELAY_SECONDS must be a non-negative integer" >&2
              return 2
            fi
            if ! [[ "$audit_timeout_seconds" =~ ^[1-9][0-9]*$ ]]; then
              echo "PIP_AUDIT_TIMEOUT must be a positive integer" >&2
              return 2
            fi
            while true; do
              if "$@" --timeout "$audit_timeout_seconds"; then
                return 0
              fi
              local status=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$status"
              fi
              echo "pip-audit failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
              attempt=$((attempt + 1))
              sleep "$retry_delay_seconds"
            done
          }

          run_pip_audit_with_retry pip-audit -s osv -r constraints.txt --no-deps --disable-pip --progress-spinner off \
            --desc on \
            --format markdown \
            --output "$backend_report" || true
          run_pip_audit_with_retry pip-audit -s osv -r ../../scripts/paper/requirements.txt --no-deps --disable-pip --progress-spinner off \
            --desc on \
            --format markdown \
            --output "$paper_report" || true
          echo "::endgroup::"

          {
            echo "## Backend locked Python constraints"
            if [ -s "$backend_report" ]; then
              cat "$backend_report"
            else
              echo "_pip-audit did not generate a backend report._"
            fi
            echo
            echo "## Paper script Python requirements"
            if [ -s "$paper_report" ]; then
              cat "$paper_report"
            else
              echo "_pip-audit did not generate a paper script report._"
            fi
          } > pip-audit-report.md

          # 输出报告内容
          cat pip-audit-report.md

          # 严格模式: 发现漏洞时失败
          run_pip_audit_with_retry pip-audit -s osv -r constraints.txt --no-deps --disable-pip --strict --progress-spinner off
          run_pip_audit_with_retry pip-audit -s osv -r ../../scripts/paper/requirements.txt --no-deps --disable-pip --strict --progress-spinner off

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-audit-report
          path: frontend/backend/pip-audit-report.md
          retention-days: 30

  # ============================================================================
  # Node.js 依赖安全审计
  # ============================================================================
  npm-audit:
    name: NPM Dependencies Audit
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        working-directory: .
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Download repo tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Checkout repository
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "::group::npm audit results"
          npm_audit_output_has_endpoint_error() {
            local output="${1:-}"
            [[ "$output" == *"audit endpoint returned an error"* ]] \
              || [[ "$output" == *"npm warn audit request"* ]] \
              || [[ "$output" == *"Client network socket disconnected before secure TLS connection was established"* ]]
          }

          run_npm_audit_with_retry() {
            local attempt=1
            local max_attempts="${NPM_AUDIT_ATTEMPTS:-3}"
            local retry_delay_seconds="${NPM_AUDIT_RETRY_DELAY_SECONDS:-2}"
            if ! [[ "$max_attempts" =~ ^[1-9][0-9]*$ ]]; then
              echo "NPM_AUDIT_ATTEMPTS must be a positive integer" >&2
              return 2
            fi
            if ! [[ "$retry_delay_seconds" =~ ^[0-9]+$ ]]; then
              echo "NPM_AUDIT_RETRY_DELAY_SECONDS must be a non-negative integer" >&2
              return 2
            fi
            local output=""
            local output_file="${NPM_AUDIT_OUTPUT_FILE:-}"
            while true; do
              if output="$("$@" 2>&1)"; then
                local status=0
              else
                local status=$?
              fi
              if [ -n "$output_file" ]; then
                printf '%s\n' "$output" > "$output_file"
              elif [ -n "$output" ]; then
                printf '%s\n' "$output"
              fi
              if [ "$status" -eq 0 ] && ! npm_audit_output_has_endpoint_error "$output"; then
                return 0
              fi
              if [ "$status" -eq 0 ]; then
                status=1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$status"
              fi
              echo "npm audit failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
              attempt=$((attempt + 1))
              sleep "$retry_delay_seconds"
            done
          }

          # 某些环境默认 registry（例如 npmmirror）不支持 npm audit API；显式指定 npmjs registry 提升 CI 稳定性。
          # 生成 JSON 报告
          NPM_AUDIT_OUTPUT_FILE=npm-audit-report.json run_npm_audit_with_retry npm audit --registry=https://registry.npmjs.org --json || true

          # 人类可读格式输出
          run_npm_audit_with_retry npm audit --registry=https://registry.npmjs.org --audit-level=moderate || true
          echo "::endgroup::"

          # 严格模式: high/critical 漏洞时失败
          run_npm_audit_with_retry npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: frontend/web/npm-audit-report.json
          retention-days: 30

  # ============================================================================
  # 汇总报告
  # ============================================================================
  summary:
    name: Audit Summary
    needs: [python-audit, npm-audit]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: always()

    steps:
      - name: Generate summary
        # 使用环境变量传递 job results，避免直接在 shell 中展开
        env:
          PYTHON_RESULT: ${{ needs.python-audit.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
        run: |
          echo "## Security Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$PYTHON_RESULT" = "success" ]; then
            echo "- :white_check_mark: Python dependencies: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: Python dependencies: **FAIL** - vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$NPM_RESULT" = "success" ]; then
            echo "- :white_check_mark: NPM dependencies: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: NPM dependencies: **FAIL** - vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Audit reports available as artifacts._" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any audit failed
        env:
          PYTHON_RESULT: ${{ needs.python-audit.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
        run: |
          if [ "$PYTHON_RESULT" = "failure" ] || [ "$NPM_RESULT" = "failure" ]; then
            echo "::error::Security vulnerabilities detected. See audit reports for details."
            exit 1
          fi
