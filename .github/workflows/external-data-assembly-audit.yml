name: External Data Assembly Audit

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: "Path to humanLncAtlas data directory on runner (HUMAN_LNC_ATLAS_DATA_DIR)"
        required: false
        default: "/data/wenyujianData/humanLncAtlas"
      assembly:
        description: "Genome assembly to validate against (ASSEMBLY)"
        required: false
        default: "hg19"
  schedule:
    # Weekly audit (UTC). Uses self-hosted runner; if runner offline, job will queue.
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  contents: read

jobs:
  audit:
    name: hg19 external data audit
    runs-on: self-hosted
    env:
      # Default to workflow_dispatch inputs; for schedule these are empty and fall back to defaults.
      HUMAN_LNC_ATLAS_DATA_DIR: ${{ github.event.inputs.data_dir || '/data/wenyujianData/humanLncAtlas' }}
      ASSEMBLY: ${{ github.event.inputs.assembly || 'hg19' }}

      # Network: self-hosted runners in restricted environments may require an HTTP proxy.
      # Override via repo variables (Settings → Secrets and variables → Actions → Variables).
      PROXY_URL: ${{ vars.PROXY_URL || 'http://127.0.0.1:7890' }}
      HTTP_PROXY: ${{ vars.HTTP_PROXY || vars.PROXY_URL || 'http://127.0.0.1:7890' }}
      HTTPS_PROXY: ${{ vars.HTTPS_PROXY || vars.PROXY_URL || 'http://127.0.0.1:7890' }}
      NO_PROXY: ${{ vars.NO_PROXY || '127.0.0.1,localhost,::1' }}
    steps:
      - name: Export proxy env aliases
        run: |
          set -euo pipefail
          echo "http_proxy=${HTTP_PROXY}" >> "$GITHUB_ENV"
          echo "https_proxy=${HTTPS_PROXY}" >> "$GITHUB_ENV"
          echo "no_proxy=${NO_PROXY}" >> "$GITHUB_ENV"

      - name: Download repo tarball (self-hosted)
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Run external assembly audit (read-only)
        id: audit
        run: |
          set -euo pipefail
          bash scripts/genomes/audit_external_data_assemblies.sh

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-assembly-audit
          path: ${{ steps.audit.outputs.audit_dir }}
          if-no-files-found: warn
