name: Tests

on:
  # CI 暂停自动触发：GitHub-hosted runner 受账单/额度限制时会导致大量噪音失败。
  # 如需恢复 push/PR 自动 CI，请在此处重新加入 push/pull_request 触发器。
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label override (e.g. self-hosted). Empty = use repo variable CI_RUNS_ON or default ubuntu-latest."
        required: false
        default: ""
      enable_postgres_jobs:
        description: "Enable Postgres service jobs when running on self-hosted (default false)."
        required: false
        default: "false"
      enable_e2e_tests:
        description: "Enable self-hosted E2E Tests job (requires backend services running)."
        required: false
        default: "false"

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  contents: read
  pull-requests: read

env:
  # 解析后的 runs-on（用于 step 条件判断）
  CI_RUNS_ON: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Secret scanning - runs first to fail fast on credential leaks
  secret-scan:
    name: Secret Scanning
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for scanning all commits

      - name: Cleanup gitleaks temp
        run: |
          rm -f /tmp/gitleaks.tmp

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # self-hosted runner 上 artifact 上传偶发路径兼容性问题；这里直接关闭上传。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web
        run: npm run test:run

  backend-checks:
    name: Backend Checks
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements*.txt
            frontend/backend/constraints.txt

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run Ruff (backend)
        working-directory: frontend/backend
        run: |
          ruff check .

      - name: Verify Python imports
        working-directory: frontend/backend
        run: |
          python -c "from app.core.config import settings; print('Config loaded')"
          python -c "from app.core.database import engine; print('Database module loaded')"
          python -c "from app.core.cache import cache; print('Cache module loaded')"
          python -c "from app.core.exceptions import sanitize_db_error; print('Exceptions module loaded')"
          python -c "import main; print('Main app loaded')"

      - name: Check for syntax errors
        working-directory: frontend/backend
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files have valid syntax"

      - name: Docs drift check (startup commands)
        run: |
          python3 scripts/check_docs_commands.py
          python3 scripts/check_docs_status_markers.py

      - name: Run ETL input checks (unit tests)
        run: |
          python -m pytest -q etl/tests

      - name: Verify ETL sample inputs manifest
        run: |
          python -m etl.input_manifest verify etl/sample_inputs/etl-inputs.manifest.tsv

      - name: Run scripts smoke tests (offline genome assets)
        run: |
          bash scripts/genomes/tests/test_download_igv_assets.sh

      - name: Run scripts unit tests (run-tests.sh)
        run: |
          bash scripts/tests/test_run_tests_frontend_deps.sh
          bash scripts/tests/test_run_tests_backend_deps.sh
          bash scripts/tests/test_check_docs_status_markers.sh

  lint:
    name: Lint
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint
        continue-on-error: false

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements*.txt
            frontend/backend/constraints.txt

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run unit tests (marked with @pytest.mark.unit)
        working-directory: frontend/backend
        run: |
          # Run only unit tests (no external dependencies required)
          # Uses pytest markers instead of --ignore flags
          python -m pytest -m unit -v --tb=short

  etl-e2e-smoke:
    name: ETL E2E Smoke (Postgres)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # self-hosted runner 默认不跑 services(Postgres) 作业，避免 Docker/权限差异导致 CI 直接失败。
    # 如需在 self-hosted 上启用：设置 repo variable `CI_ENABLE_POSTGRES_JOBS=true`。
    if: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest') != 'self-hosted' || ((github.event_name == 'workflow_dispatch' && github.event.inputs.enable_postgres_jobs) || vars.CI_ENABLE_POSTGRES_JOBS) == 'true' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lncrna_etl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lncrna_etl_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements.txt
            frontend/backend/constraints.txt

      - name: Install ETL dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary==2.9.9

      - name: Wait for Postgres
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          import psycopg2

          config = {
              "host": os.environ["DB_HOST"],
              "port": os.environ["DB_PORT"],
              "dbname": os.environ["DB_NAME"],
              "user": os.environ["DB_USER"],
              "password": os.environ["DB_PASSWORD"],
          }

          for _ in range(60):
              try:
                  conn = psycopg2.connect(**config)
                  conn.close()
                  print("Postgres is ready")
                  sys.exit(0)
              except Exception:
                  time.sleep(1)

          print("Postgres did not become ready in time", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Init schema (v2.3 core)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          export PGPASSWORD="$DB_PASSWORD"
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f schema/v2.3/01_core.sql

      - name: Seed minimal genes for sample inputs
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python - <<'PY'
          import os

          import psycopg2

          conn = psycopg2.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
          )
          conn.autocommit = True
          cur = conn.cursor()

          cur.execute("SELECT species_id FROM species WHERE species_code = %s", ("human",))
          row = cur.fetchone()
          if not row:
              raise RuntimeError("Missing species row for 'human' after schema init")
          human_species_id = int(row[0])

          cur.execute(
              """
              INSERT INTO genes (species_id, gene_ensembl_id, gene_name, chromosome, gene_start, gene_end, strand)
              VALUES
                (%s, %s, %s, %s, %s, %s, %s),
                (%s, %s, %s, %s, %s, %s, %s),
                (%s, %s, %s, %s, %s, %s, %s),
                (%s, %s, %s, %s, %s, %s, %s)
              """,
              (
                  human_species_id,
                  "CATG00000000034",
                  "CATG00000000034",
                  "chr17",
                  1000000,
                  1000500,
                  "+",
                  human_species_id,
                  "CATG00000000045",
                  "CATG00000000045",
                  "chr17",
                  81137057,
                  81137122,
                  "+",
                  human_species_id,
                  "ENSG00000012048",
                  "ENSG00000012048",
                  "chr17",
                  43044295,
                  43044350,
                  "+",
                  human_species_id,
                  "ENSG00000141510",
                  "ENSG00000141510",
                  "chr17",
                  7661779,
                  7661830,
                  "+",
              ),
          )

          cur.close()
          conn.close()
          print("Seeded minimal genes for ETL sample inputs")
          PY

      - name: Run ETL import_regulations (sample)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python3 etl/import_regulations.py \
            --file etl/sample_inputs/human_batch_human.tsv \
            --species human \
            --batch-name ci-smoke \
            --host "$DB_HOST" \
            --port "$DB_PORT" \
            --dbname "$DB_NAME" \
            --user "$DB_USER" \
            --password "$DB_PASSWORD" \
            --store-sequences \
            --commit-every 0

      - name: Verify sample import (value-level)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python3 etl/smoke_verify_sample_import.py

  api-snapshot-baseline:
    name: API Snapshot Baseline (Postgres)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # self-hosted runner 默认不跑 services(Postgres) 作业，避免 Docker/权限差异导致 CI 直接失败。
    # 如需在 self-hosted 上启用：设置 repo variable `CI_ENABLE_POSTGRES_JOBS=true`。
    if: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest') != 'self-hosted' || ((github.event_name == 'workflow_dispatch' && github.event.inputs.enable_postgres_jobs) || vars.CI_ENABLE_POSTGRES_JOBS) == 'true' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lncrna
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lncrna_api_baseline_ci
          # CI-only: allow local TCP connections without password issues (isolated service container).
          # This avoids flakiness from auth mismatches while keeping the job self-contained.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lncrna -d lncrna_api_baseline_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements.txt
            frontend/backend/constraints.txt

      - name: Install backend dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Init schema + sample data (v2.3)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_api_baseline_ci
          DB_USER: lncrna
          DB_PASSWORD: postgres
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          export PGPASSWORD="$DB_PASSWORD"

          for f in \
            "schema/v2.3/01_core.sql" \
            "schema/v2.3/02_extension.sql" \
            "frontend/backend/sql/chipseq_schema.sql" \
            "schema/v2.3/03_sample_data.sql"; do
            echo "[api-baseline] loading: ${f}"
            psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f "$f"
          done

      - name: Verify API snapshot baseline (sample dataset)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: lncrna_api_baseline_ci
          DB_USER: lncrna
          DB_PASSWORD: postgres
          # Baseline is generated with cache disabled to keep results stable and avoid Redis dependency.
          ENABLE_CACHE: "false"
        run: |
          set -euo pipefail

          cd frontend/backend

          # Backend startup security gate (required by main.py lifespan).
          # Generate a random key at runtime (do NOT commit secrets; avoids gitleaks false positives).
          export ADMIN_API_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"

          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1 &
          backend_pid=$!
          trap 'kill "$backend_pid" >/dev/null 2>&1 || true' EXIT

          timeout=60
          while ! curl -fsS "http://127.0.0.1:8000/health" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Backend did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          python ../../scripts/api_snapshot.py \
            --base-url "http://127.0.0.1:8000" \
            --check-baseline ../../docs/baselines/api-snapshot.sample.json

  build:
    name: Build
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [secret-scan, frontend-unit-tests, backend-checks, backend-unit-tests, lint]
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Security guard - disallow embedded Admin API Key in CI production build
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # P0 SECURITY: Never allow VITE_ADMIN_API_KEY in CI production builds.
          # Vite will embed it into the JS bundle, and the key can be extracted from dist/.
          admin_env="$(printf '%s' "${VITE_ADMIN_API_KEY:-}" | tr -d '[:space:]')"
          if [ -n "${admin_env:-}" ]; then
            echo "::error::VITE_ADMIN_API_KEY is set in CI environment. Refusing to build production bundle."
            echo "::error::Use reverse proxy injection (recommended) or session-based auth instead."
            exit 1
          fi

          # Also guard against accidentally committed env files (should not happen, but fail fast).
          for f in .env .env.*; do
            # Skip non-existent globs and example templates
            if [ ! -f "$f" ] || [ "$f" = ".env.example" ]; then
              continue
            fi

            raw="$(grep -E '^[[:space:]]*VITE_ADMIN_API_KEY=' "$f" | head -n 1 | cut -d= -f2- || true)"
            trimmed="$(printf '%s' "${raw:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            # Strip one layer of surrounding quotes
            trimmed="${trimmed%\"}"; trimmed="${trimmed#\"}"
            trimmed="${trimmed%\'}"; trimmed="${trimmed#\'}"

            if [ -n "${trimmed:-}" ]; then
              echo "::error::Found non-empty VITE_ADMIN_API_KEY in $f. Refusing to build production bundle."
              exit 1
            fi
          done

      - name: Build
        working-directory: frontend/web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/web/dist/
          retention-days: 7

  # E2E smoke tests - default ubuntu-latest (can switch via CI_RUNS_ON), fully mocked (no backend/db required)
  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: [build]
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: frontend/web/dist

      - name: Normalize dist path for preview
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # Prefer dist in-place (ideal).
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            exit 0
          fi

          # Common extraction patterns for actions/download-artifact.
          if [ -d "../dist" ] && [ -f "../dist/index.html" ]; then
            mv ../dist dist
            exit 0
          fi

          if [ -d "../build" ] && [ -f "../build/index.html" ]; then
            mkdir -p dist
            cp -R ../build/* dist/
            exit 0
          fi

          if [ -d "build" ] && [ -f "build/index.html" ]; then
            mkdir -p dist
            cp -R build/* dist/
            exit 0
          fi

          echo "::error::Unable to locate Vite build output after downloading artifact"
          echo "::group::Workspace root"
          ls -la ..
          echo "::endgroup::"
          echo "::group::Frontend directory"
          ls -la .
          echo "::endgroup::"
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # GitHub-hosted runner 可用 `--with-deps` 自动安装系统依赖；
          # self-hosted runner 可能无 sudo/apt 权限，避免在 CI 内强行改系统环境。
          if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Run E2E smoke tests
        working-directory: frontend/web
        env:
          BASE_URL: http://127.0.0.1:5173
          CI: true
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "::error::Missing frontend build output at frontend/web/dist"
            exit 1
          fi

          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          timeout=60
          while ! curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Frontend preview server did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          npx playwright test \
            e2e/lncrna-chipseq-overlap-query-too-broad.spec.ts \
            e2e/genes-smoke.spec.ts \
            e2e/regulations-smoke.spec.ts \
            e2e/stats-smoke.spec.ts \
            e2e/diseases-smoke.spec.ts \
            e2e/analysis-smoke.spec.ts \
            e2e/conservation-smoke.spec.ts \
            e2e/visualization-hub-smoke.spec.ts \
            e2e/admin-monitoring-smoke.spec.ts \
            e2e/admin-cache-smoke.spec.ts \
            e2e/admin-materialized-views-smoke.spec.ts \
            --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: frontend/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-screenshots
          path: frontend/web/test-results/
          retention-days: 7

  # E2E tests - requires running backend server and database
  # Only runs on workflow_dispatch (manual trigger) on self-hosted runner
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_e2e_tests == 'true' }}
    needs: [build]
    env:
      CI_RUNS_ON: self-hosted
    steps:
      - name: Configure git transport (self-hosted)
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: frontend/web/dist

      - name: Normalize dist path for preview
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # Prefer dist in-place (ideal).
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            exit 0
          fi

          # Common extraction patterns for actions/download-artifact.
          if [ -d "../dist" ] && [ -f "../dist/index.html" ]; then
            mv ../dist dist
            exit 0
          fi

          if [ -d "../build" ] && [ -f "../build/index.html" ]; then
            mkdir -p dist
            cp -R ../build/* dist/
            exit 0
          fi

          if [ -d "build" ] && [ -f "build/index.html" ]; then
            mkdir -p dist
            cp -R build/* dist/
            exit 0
          fi

          echo "::error::Unable to locate Vite build output after downloading artifact"
          echo "::group::Workspace root"
          ls -la ..
          echo "::endgroup::"
          echo "::group::Frontend directory"
          ls -la .
          echo "::endgroup::"
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: npx playwright install chromium

      - name: Wait for backend service
        run: |
          # Wait for backend to be ready (assumes services are running on self-hosted runner)
          timeout=60
          while ! curl -s http://localhost:8000/health > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Backend service not available"
              exit 1
            fi
            echo "Waiting for backend..."
            sleep 5
            timeout=$((timeout - 5))
          done
          echo "Backend is ready!"

      - name: Run E2E tests
        working-directory: frontend/web
        env:
          BASE_URL: http://127.0.0.1:5173
          CI: true
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "::error::Missing frontend build output at frontend/web/dist"
            exit 1
          fi

          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          timeout=60
          while ! curl -fsS "http://127.0.0.1:5173/" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Frontend preview server did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          # Run a subset of critical E2E tests
          npx playwright test \
            e2e/genes-flow.spec.ts \
            e2e/lncrna-chipseq-overlap.spec.ts \
            e2e/conservation.spec.ts \
            --reporter=list

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/web/test-results/
          retention-days: 7
