name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Secret scanning - runs first to fail fast on credential leaks
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web
        run: npm run test:run

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python imports
        working-directory: frontend/backend
        run: |
          python -c "from app.core.config import settings; print('Config loaded')"
          python -c "from app.core.database import engine; print('Database module loaded')"
          python -c "from app.core.cache import cache; print('Cache module loaded')"
          python -c "from app.core.exceptions import sanitize_db_error; print('Exceptions module loaded')"
          python -c "import main; print('Main app loaded')"

      - name: Check for syntax errors
        working-directory: frontend/backend
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files have valid syntax"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint
        continue-on-error: false

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (marked with @pytest.mark.unit)
        working-directory: frontend/backend
        run: |
          # Run only unit tests (no external dependencies required)
          # Uses pytest markers instead of --ignore flags
          pytest -m unit -v --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secret-scan, frontend-unit-tests, backend-checks, backend-unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build
        working-directory: frontend/web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/web/dist/
          retention-days: 7

  # E2E tests - requires running backend server and database
  # Only runs on workflow_dispatch (manual trigger) on self-hosted runner
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: npx playwright install chromium --with-deps

      - name: Wait for backend service
        run: |
          # Wait for backend to be ready (assumes services are running on self-hosted runner)
          timeout=60
          while ! curl -s http://localhost:8000/health > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Backend service not available"
              exit 1
            fi
            echo "Waiting for backend..."
            sleep 5
            timeout=$((timeout - 5))
          done
          echo "Backend is ready!"

      - name: Run E2E tests
        working-directory: frontend/web
        env:
          BASE_URL: http://localhost:5173
          CI: true
        run: |
          # Run a subset of critical E2E tests
          npx playwright test \
            e2e/genes-flow.spec.ts \
            e2e/lncrna-chipseq-overlap.spec.ts \
            e2e/conservation.spec.ts \
            --reporter=list

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          retention-days: 7

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/web/test-results/
          retention-days: 7
