          if [ -d ".git" ]; then
            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "Current HEAD: ${current_sha:-<unknown>}"
            echo "Expected SHA: ${EXPECTED_SHA}"
            if [ -n "${current_sha:-}" ] && [ "$current_sha" = "$EXPECTED_SHA" ]; then
