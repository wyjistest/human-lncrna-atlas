        working-directory: frontend/web
        env:
          # Ensure CI build points to the intended backend (overrides committed frontend/web/.env).
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/web/dist/
          retention-days: 7

