name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web
        run: npm run test:run

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python imports
        working-directory: frontend/backend
        run: |
          python -c "from app.core.config import settings; print('Config loaded')"
          python -c "from app.core.database import engine; print('Database module loaded')"
          python -c "from app.core.cache import cache; print('Cache module loaded')"
          python -c "from app.core.exceptions import sanitize_db_error; print('Exceptions module loaded')"
          python -c "import main; print('Main app loaded')"

      - name: Check for syntax errors
        working-directory: frontend/backend
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files have valid syntax"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint
        continue-on-error: false

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio requests

      - name: Run tests
        working-directory: frontend/backend
        run: |
          # Skip all integration tests (require running server and database)
          # Integration tests: test_api_contracts, test_api_smoke, test_batch_heatmap_api,
          # test_cell_line_data_validation, test_chipseq_api, test_heatmap_matrix_performance,
          # test_igv_overlap_track, test_overlap_export, test_performance, test_phase_3_1_regression
          set -e  # Exit on error
          EXIT_CODE=0
          pytest tests/ -v \
            --ignore=tests/e2e/ \
            --ignore=tests/test_api_contracts.py \
            --ignore=tests/test_api_smoke.py \
            --ignore=tests/test_batch_heatmap_api.py \
            --ignore=tests/test_cell_line_data_validation.py \
            --ignore=tests/test_chipseq_api.py \
            --ignore=tests/test_heatmap_matrix_performance.py \
            --ignore=tests/test_igv_overlap_track.py \
            --ignore=tests/test_overlap_export.py \
            --ignore=tests/test_performance.py \
            --ignore=tests/test_phase_3_1_regression.py \
            || EXIT_CODE=$?
          # Exit code 5 = no tests collected (acceptable, all tests are integration tests)
          # Exit code 0 = tests passed
          # Exit code 1+ = tests failed (should fail CI)
          if [ $EXIT_CODE -eq 5 ]; then
            echo "No unit tests found (all tests are integration tests requiring database)"
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Tests failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-checks, backend-unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build
        working-directory: frontend/web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/web/dist/
          retention-days: 7
