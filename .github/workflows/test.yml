name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web
        run: npm run test:run

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python imports
        working-directory: frontend/backend
        run: |
          python -c "from app.core.config import settings; print('Config loaded')"
          python -c "from app.core.database import engine; print('Database module loaded')"
          python -c "from app.core.cache import cache; print('Cache module loaded')"
          python -c "from app.core.exceptions import sanitize_db_error; print('Exceptions module loaded')"
          python -c "import main; print('Main app loaded')"

      - name: Check for syntax errors
        working-directory: frontend/backend
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files have valid syntax"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/web
        run: npm run lint
        continue-on-error: false

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio requests

      - name: Run tests
        working-directory: frontend/backend
        run: |
          # Skip e2e, smoke, and performance tests (require running server)
          pytest tests/ -v --ignore=tests/e2e/ --ignore=tests/test_api_smoke.py --ignore=tests/test_performance.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, backend-checks, backend-unit-tests, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build
        working-directory: frontend/web
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: frontend/web/dist/
          retention-days: 7
