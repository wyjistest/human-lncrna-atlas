                  human_species_id,
                  "CATG00000000034",
                  "CATG00000000034",
                  "chr17",
                  1000000,
                  1000500,
                  "+",
                  human_species_id,
                  "CATG00000000045",
                  "CATG00000000045",
                  "chr17",
                  81137057,
                  81137122,
                  "+",
                  human_species_id,
                  "ENSG00000012048",
                  "ENSG00000012048",
                  "chr17",
                  43044295,
                  43044350,
                  "+",
                  human_species_id,
                  "ENSG00000141510",
                  "ENSG00000141510",
                  "chr17",
                  7661779,
                  7661830,
                  "+",
              ),
          )

          cur.close()
          conn.close()
          print("Seeded minimal genes for ETL sample inputs")
          PY

      - name: Run ETL import_regulations (sample)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: lncrna_etl_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python3 etl/import_regulations.py \
            --file etl/sample_inputs/human_batch_human.tsv \
            --species human \
            --batch-name ci-smoke \
            --host "$DB_HOST" \
            --port "$DB_PORT" \
            --dbname "$DB_NAME" \
            --user "$DB_USER" \
            --password "$DB_PASSWORD" \
            --store-sequences \
