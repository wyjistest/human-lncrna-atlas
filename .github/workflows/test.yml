          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Recovered workspace from tarball."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: frontend/web/dist

      - name: Normalize dist path for preview
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # Prefer dist in-place (ideal).
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            exit 0
          fi

          # Common extraction patterns for actions/download-artifact.
          if [ -d "../dist" ] && [ -f "../dist/index.html" ]; then
            mv ../dist dist
            exit 0
          fi

          if [ -d "../build" ] && [ -f "../build/index.html" ]; then
            mkdir -p dist
            cp -R ../build/* dist/
            exit 0
          fi

          if [ -d "build" ] && [ -f "build/index.html" ]; then
            mkdir -p dist
            cp -R build/* dist/
            exit 0
          fi

          echo "::error::Unable to locate Vite build output after downloading artifact"
          echo "::group::Workspace root"
          ls -la ..
          echo "::endgroup::"
          echo "::group::Frontend directory"
          ls -la .
          echo "::endgroup::"
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: npx playwright install chromium

      - name: Wait for backend service
        run: |
          # Wait for backend to be ready (assumes services are running on self-hosted runner)
          export NO_PROXY="127.0.0.1,localhost,::1"
          backend_health_url="${API_BASE_URL%/}/health"
          timeout=60
          while ! curl -fsS --connect-timeout 2 --max-time 5 "${backend_health_url}" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Backend service not available"
              exit 1
            fi
            echo "Waiting for backend..."
            sleep 5
            timeout=$((timeout - 5))
          done
          echo "Backend is ready!"

      - name: Run E2E tests
        working-directory: frontend/web
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
          PREVIEW_HOST: 127.0.0.1
          CI: true
        run: |
          set -euo pipefail

          if [ ! -d "dist" ]; then
            echo "::error::Missing frontend build output at frontend/web/dist"
            exit 1
          fi

          export NO_PROXY="127.0.0.1,localhost,::1"

          # self-hosted runner 可能同时被用作开发机：端口可能被占用；
          # 同时后端可能通过环境变量 CORS_ORIGINS 限制允许的 Origin。
          # 这里选择一个同时满足：
          # 1) preview 端口可用（可绑定）
          # 2) 后端对该 Origin 返回 Access-Control-Allow-Origin（避免浏览器侧被 CORS 拦截）
          backend_health_url="${API_BASE_URL%/}/health"
          PREVIEW_PORT=""
          for port in $(seq 5173 5192); do
            # 1) 端口可用性检查（能绑定才算可用）
            if ! node -e 'const net=require("net"); const host=process.env.PREVIEW_HOST||"127.0.0.1"; const port=Number(process.argv[1]); const server=net.createServer(); server.unref(); server.on("error",()=>process.exit(1)); server.listen(port, host, ()=>server.close(()=>process.exit(0)));' "$port" >/dev/null 2>&1; then
              continue
            fi

            # 2) 后端 CORS 允许性检查
            origin="http://${PREVIEW_HOST}:${port}"
            if curl -fsS --connect-timeout 2 --max-time 5 -D - -o /dev/null -H "Origin: ${origin}" "${backend_health_url}" \
              | tr -d '\r' \
              | grep -qi "^access-control-allow-origin:[[:space:]]*${origin}$"; then
              PREVIEW_PORT="$port"
              break
            fi
          done

          if [ -z "${PREVIEW_PORT:-}" ]; then
            echo "::error::No preview port available that is also allowed by backend CORS."
            echo "::error::Free port 5173 (recommended), or extend backend CORS_ORIGINS to include the chosen preview origin."
            echo "::error::Example: CORS_ORIGINS='[\"http://127.0.0.1:5173\",\"http://127.0.0.1:5174\",\"http://localhost:5173\",\"http://localhost:5174\"]'"
            exit 1
          fi
          export PREVIEW_PORT

          export BASE_URL="http://${PREVIEW_HOST}:${PREVIEW_PORT}"

          npm run preview -- --host "${PREVIEW_HOST}" --port "${PREVIEW_PORT}" --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          timeout=60
          while ! curl -fsS --max-time 5 "${BASE_URL}/" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Frontend preview server did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          # Run a subset of critical E2E tests
          npx playwright test \
            e2e/genes-flow.spec.ts \
            e2e/lncrna-chipseq-overlap.spec.ts \
            e2e/conservation.spec.ts \
            --project=chromium \
            --reporter=list

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/web/test-results/
          retention-days: 7

  # Performance audit - requires running backend server (manual trigger only)
  performance-audit:
    name: Performance Audit (Playwright)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_performance_audit == 'true' }}
    needs: [build]
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: ${{ env.CI_RUNS_ON == 'self-hosted' }}

      - name: Recover workspace when checkout fails (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' && steps.checkout.outcome == 'failure' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::warning::actions/checkout failed on self-hosted runner; attempting recovery."

          # 1) If the workspace already contains the expected commit, proceed without fetching.
          if [ -d ".git" ]; then
            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "Current HEAD: ${current_sha:-<unknown>}"
            echo "Expected SHA: ${EXPECTED_SHA}"
            if [ -n "${current_sha:-}" ] && [ "$current_sha" = "$EXPECTED_SHA" ]; then
              echo "Workspace already at expected SHA, continue."
              exit 0
            fi
          fi

          # 2) Fallback: download repo tarball via GitHub API (avoids git+gnutls flakiness).
          echo "Falling back to tarball download for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Recovered workspace from tarball."

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: frontend/web/dist

      - name: Normalize dist path for preview
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # Prefer dist in-place (ideal).
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            exit 0
          fi

          # Common extraction patterns for actions/download-artifact.
          if [ -d "../dist" ] && [ -f "../dist/index.html" ]; then
            mv ../dist dist
            exit 0
          fi

          if [ -d "../build" ] && [ -f "../build/index.html" ]; then
            mkdir -p dist
            cp -R ../build/* dist/
            exit 0
          fi

          if [ -d "build" ] && [ -f "build/index.html" ]; then
            mkdir -p dist
            cp -R build/* dist/
            exit 0
          fi

          echo "::error::Unable to locate Vite build output after downloading artifact"
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: |
          set -euo pipefail

          if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install chromium --with-deps
          fi

      - name: Run performance audit (requires backend)
        working-directory: frontend/web
        env:
          PREVIEW_HOST: 127.0.0.1
          CI: true
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          set -euo pipefail

          export NO_PROXY="127.0.0.1,localhost,::1"
          export no_proxy="${NO_PROXY}"

          if [ ! -d "dist" ]; then
            echo "::error::Missing frontend build output at frontend/web/dist"
            exit 1
          fi

          # Backend health check (manual job: user must provide running backend)
          if ! curl -fsS --connect-timeout 2 --max-time 5 "${API_BASE_URL}/health" >/dev/null 2>&1; then
            echo "::error::Backend is not reachable: ${API_BASE_URL}/health"
            echo "::error::This job requires a running backend on the runner machine."
            exit 1
          fi

          PREVIEW_PORT="$(
            node -e 'const net=require("net"); const host=process.env.PREVIEW_HOST||"127.0.0.1"; const candidates=Array.from({length:20},(_,i)=>5173+i); (function tryPort(index){ if(index>=candidates.length) process.exit(1); const port=candidates[index]; const server=net.createServer(); server.unref(); server.on("error",()=>tryPort(index+1)); server.listen(port, host, ()=>{ console.log(port); server.close(); }); })(0);'
          )"
          export PREVIEW_PORT

          export BASE_URL="http://${PREVIEW_HOST}:${PREVIEW_PORT}"

          npm run preview -- --host "${PREVIEW_HOST}" --port "${PREVIEW_PORT}" --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          timeout=60
          while ! curl -fsS --max-time 5 "${BASE_URL}/" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Frontend preview server did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          npm run test:performance
          node scripts/compare-performance-metrics.js \
            --baseline performance-baseline-metrics.json \
            --current test-results/performance-latest-metrics.json \
            --out test-results/performance-compare.txt

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-audit
          path: |
            frontend/web/test-results/
            frontend/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
