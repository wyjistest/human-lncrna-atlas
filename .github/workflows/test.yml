name: Tests

on:
  # CI 默认对 main 分支 push 自动触发（优先使用 self-hosted，避免 GitHub-hosted runner 受账单/额度限制阻塞）。
  # PR CI（pull_request）在 self-hosted 上存在“运行不受信任代码”的风险，默认不启用；如需启用请评估后再开启。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label override (e.g. self-hosted). Empty = use repo variable CI_RUNS_ON or default ubuntu-latest."
        required: false
        default: ""
      api_base_url:
        description: "Backend origin for E2E (e.g. http://127.0.0.1:8000). Used for health checks and Vite build VITE_API_BASE_URL."
        required: false
        default: "http://127.0.0.1:8000"
      enable_postgres_jobs:
        description: "Enable Postgres service jobs when running on self-hosted (default false)."
        required: false
        default: "false"
      enable_e2e_tests:
        description: "Enable self-hosted E2E Tests job (requires backend services running)."
        required: false
        default: "false"
      enable_performance_audit:
        description: "Enable Performance Audit job (Playwright performance suite; requires backend services running)."
        required: false
        default: "false"
      enable_firefox_smoke:
        description: "Enable optional Firefox run for E2E smoke (workflow_dispatch only)."
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  contents: read
  pull-requests: read

env:
  # 解析后的 runs-on（用于 step 条件判断）
  CI_RUNS_ON: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
  # 默认用于 self-hosted 集成向 E2E（以及 build 时注入 VITE_API_BASE_URL）。可选：用 repo variable `CI_API_BASE_URL` 提供默认值。
  API_BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.api_base_url) || vars.CI_API_BASE_URL || 'http://127.0.0.1:8000' }}
  # 可选：在 workflow_dispatch 时额外跑一轮 Firefox smoke（默认 false，不影响 push CI）
  ENABLE_FIREFOX_SMOKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_firefox_smoke == 'true' }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Secret scanning - runs first to fail fast on credential leaks
  secret-scan:
    name: Secret Scanning
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout source via tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # self-hosted 上 git checkout 偶发卡住（网络/TLS 抖动），这里直接用 GitHub API tarball 取源码，
          # 并让 gitleaks 在 filesystem 模式运行（可审计、可用且更稳定）。
          echo "Downloading tarball for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Checked out workspace from tarball."

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for scanning all commits

      - name: Detect git repository state
        id: gitleaks_repo
        run: |
          set -euo pipefail
          if [ -d ".git" ]; then
            echo "has_git=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # tarball 兜底会移除 .git（无 commit 历史），此时 gitleaks-action 的 `${base}^..${head}` 范围会失败；
          # 改为 filesystem 扫描当前工作区，保证“可用且可审计”。
          echo "has_git=false" >> "$GITHUB_OUTPUT"

      - name: Cleanup gitleaks temp
        run: |
          rm -f /tmp/gitleaks.tmp

      - name: Run Gitleaks (git history)
        if: ${{ steps.gitleaks_repo.outputs.has_git == 'true' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # self-hosted runner 上 artifact 上传偶发路径兼容性问题；这里直接关闭上传。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Install gitleaks (filesystem fallback)
        if: ${{ steps.gitleaks_repo.outputs.has_git != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail

          version="${GITLEAKS_VERSION}"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="x64" ;;
            aarch64) arch="arm64" ;;
            arm64) arch="arm64" ;;
            *)
              echo "::error::Unsupported architecture: ${arch}"
              exit 1
              ;;
          esac

          # self-hosted 环境对 github.com 直连经常超时；统一走 api.github.com 下载 release asset（会重定向到对象存储）。
          api="https://api.github.com"
          asset_name="gitleaks_${version}_${os}_${arch}.tar.gz"
          tmp_dir="$(mktemp -d)"
          release_json="${tmp_dir}/release.json"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/repos/zricethezav/gitleaks/releases/tags/v${version}" \
            -o "$release_json"

          if command -v python3 >/dev/null 2>&1; then
            asset_id="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); name=sys.argv[2]; ids=[a.get("id") for a in data.get("assets", []) if a.get("name")==name]; print(ids[0]) if ids else sys.exit(1)' "$release_json" "$asset_name")"
          elif command -v python >/dev/null 2>&1; then
            asset_id="$(python -c 'import json,sys; data=json.load(open(sys.argv[1])); name=sys.argv[2]; ids=[a.get("id") for a in data.get("assets", []) if a.get("name")==name]; print(ids[0]) if ids else sys.exit(1)' "$release_json" "$asset_name")"
          elif command -v node >/dev/null 2>&1; then
            asset_id="$(node -e 'const fs=require("fs");const p=process.argv[1];const n=process.argv[2];const d=JSON.parse(fs.readFileSync(p,"utf8"));const a=(d.assets||[]).find(x=>x.name===n);if(!a){process.exit(1);}process.stdout.write(String(a.id));' "$release_json" "$asset_name")"
          else
            echo "::error::Missing python/node to parse GitHub API response for gitleaks release."
            exit 1
          fi

          if [ -z "${asset_id:-}" ]; then
            echo "::error::Failed to locate gitleaks release asset: ${asset_name}"
            exit 1
          fi

          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${api}/repos/zricethezav/gitleaks/releases/assets/${asset_id}" \
            -o "${tmp_dir}/gitleaks.tar.gz"
          tar -xzf "${tmp_dir}/gitleaks.tar.gz" -C "$tmp_dir"

          install -m 0755 "${tmp_dir}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Run Gitleaks (filesystem fallback)
        if: ${{ steps.gitleaks_repo.outputs.has_git != 'true' }}
        run: |
          set -euo pipefail

          gitleaks detect \
            --no-git \
            --source . \
            --redact \
            -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=debug

  # self-hosted runner 的 CI 默认只有 1 个 runner 并行度，拆分成多个 job 会导致重复 checkout / install，
  # 总耗时接近线性叠加。这里提供一个“快路径”：在 self-hosted 上把核心门禁合并到单个 job 内串行执行。
  self-hosted-fast-ci:
    name: Self-hosted Fast CI
    runs-on: self-hosted
    if: ${{ (vars.CI_RUNS_ON || 'ubuntu-latest') == 'self-hosted' && github.event_name == 'push' }}
    needs: [secret-scan]
    env:
      CI_RUNS_ON: self-hosted
    steps:
      - name: Configure git transport (self-hosted)
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true

      - name: Recover workspace when checkout fails (self-hosted)
        if: ${{ steps.checkout.outcome == 'failure' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::warning::actions/checkout failed on self-hosted runner; attempting recovery."

          # 1) If the workspace already contains the expected commit, proceed without fetching.
          if [ -d ".git" ]; then
            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "Current HEAD: ${current_sha:-<unknown>}"
            echo "Expected SHA: ${EXPECTED_SHA}"
            if [ -n "${current_sha:-}" ] && [ "$current_sha" = "$EXPECTED_SHA" ]; then
              echo "Workspace already at expected SHA, continue."
              exit 0
            fi
          fi

          # 2) Fallback: download repo tarball via GitHub API (avoids git+gnutls flakiness).
          echo "Falling back to tarball download for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Recovered workspace from tarball."

      - name: Prepare git snapshot (self-hosted fallback)
        if: ${{ steps.checkout.outcome == 'failure' }}
        run: |
          set -euo pipefail

          # tarball 兜底会移除 .git；部分 CI 校验（docs drift check 等）依赖 `git ls-files`。
          # 这里创建一个“git 快照”（无需 push），确保后续脚本在 fallback 场景也可运行。
          if [ ! -d ".git" ]; then
            git init
            git config user.email "ci@example.invalid"
            git config user.name "CI"
            git add -A
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run core checks (self-hosted fast path)
        env:
          # Ensure CI build points to the intended backend (overrides committed frontend/web/.env).
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          bash scripts/run-tests.sh ci

      - name: Install Playwright browsers
        working-directory: frontend/web
        run: |
          set -euo pipefail

          # self-hosted runner 可能无 sudo/apt 权限，避免在 CI 内强行改系统环境。
          browsers="chromium"
          if [ "${ENABLE_FIREFOX_SMOKE}" = "true" ]; then
            browsers="chromium firefox"
          fi

          npx playwright install ${browsers}

      - name: Run E2E smoke tests
        working-directory: frontend/web
        env:
          PREVIEW_HOST: 127.0.0.1
          CI: true
        run: |
          set -euo pipefail

          # 兼容 runner 的代理环境：避免 curl 对本地地址走代理导致探活误判。
          export NO_PROXY="127.0.0.1,localhost,::1"
          export no_proxy="${NO_PROXY}"

          if [ ! -d "dist" ]; then
            echo "::error::Missing frontend build output at frontend/web/dist"
            exit 1
          fi

          # self-hosted runner 可能同时被用作开发机，固定端口可能被占用。
          # 这里优先尝试 5173，若占用则回退到下一个可用端口。
          PREVIEW_PORT="$(
            node -e 'const net=require("net"); const host=process.env.PREVIEW_HOST||"127.0.0.1"; const candidates=Array.from({length:20},(_,i)=>5173+i); (function tryPort(index){ if(index>=candidates.length) process.exit(1); const port=candidates[index]; const server=net.createServer(); server.unref(); server.on("error",()=>tryPort(index+1)); server.listen(port, host, ()=>{ console.log(port); server.close(); }); })(0);'
          )"
          export PREVIEW_PORT

          export BASE_URL="http://${PREVIEW_HOST}:${PREVIEW_PORT}"

          npm run preview -- --host "${PREVIEW_HOST}" --port "${PREVIEW_PORT}" --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT

          timeout=60
          while ! curl -fsS --max-time 5 "${BASE_URL}/" >/dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "::error::Frontend preview server did not become ready in time"
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done

          specs=(
            e2e/lncrna-chipseq-overlap-query-too-broad.spec.ts
            e2e/genes-smoke.spec.ts
            e2e/regulations-smoke.spec.ts
            e2e/stats-smoke.spec.ts
            e2e/diseases-smoke.spec.ts
            e2e/analysis-smoke.spec.ts
            e2e/conservation-smoke.spec.ts
            e2e/chipseq-compare-smoke.spec.ts
            e2e/chipseq-compare-journey-smoke.spec.ts
            e2e/visualization-hub-smoke.spec.ts
            e2e/admin-monitoring-smoke.spec.ts
            e2e/admin-cache-smoke.spec.ts
            e2e/admin-materialized-views-smoke.spec.ts
          )

          # 默认保持 chromium-only（与历史 CI 行为一致）
          npx playwright test "${specs[@]}" --project=chromium --reporter=list

          # 可选：workflow_dispatch 时追加跑 Firefox（更早发现跨浏览器回归）
          if [ "${ENABLE_FIREFOX_SMOKE}" = "true" ]; then
            npx playwright test "${specs[@]}" --project=firefox --reporter=list
          fi

          # 生产前门禁（轻量）：A11y smoke（axe-core）
          npx playwright test e2e/a11y-smoke.spec.ts --project=chromium --reporter=list

          # 生产前门禁（轻量）：视觉回归 smoke（screenshots）
          # 说明：视觉快照对环境更敏感（字体/渲染差异），默认仅在 self-hosted 上跑，避免跨环境误报。
          if [ "${CI_RUNS_ON}" = "self-hosted" ]; then
            npx playwright test e2e/visual-regression-smoke.spec.ts --project=chromium --reporter=list
          else
            echo "::notice::Skip visual regression smoke on non-self-hosted runner (CI_RUNS_ON=${CI_RUNS_ON})."
          fi

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.CI_RUNS_ON || 'ubuntu-latest') != 'self-hosted' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: ${{ env.CI_RUNS_ON == 'self-hosted' }}

      - name: Recover workspace when checkout fails (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' && steps.checkout.outcome == 'failure' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::warning::actions/checkout failed on self-hosted runner; attempting recovery."

          # 1) If the workspace already contains the expected commit, proceed without fetching.
          if [ -d ".git" ]; then
            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "Current HEAD: ${current_sha:-<unknown>}"
            echo "Expected SHA: ${EXPECTED_SHA}"
            if [ -n "${current_sha:-}" ] && [ "$current_sha" = "$EXPECTED_SHA" ]; then
              echo "Workspace already at expected SHA, continue."
              exit 0
            fi
          fi

          # 2) Fallback: download repo tarball via GitHub API (avoids git+gnutls flakiness).
          echo "Falling back to tarball download for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Recovered workspace from tarball."

      - name: Set up Node.js
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Node.js (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run unit tests
        working-directory: frontend/web
        run: npm run test:run

  backend-checks:
    name: Backend Checks
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || vars.CI_RUNS_ON || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.CI_RUNS_ON || 'ubuntu-latest') != 'self-hosted' }}
    needs: [secret-scan]  # Fail fast if secrets detected
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          # self-hosted + 本机代理环境下，git(gnutls) 偶发握手中断；强制 TLSv1.2 提升稳定性
          git config --global http.sslVersion tlsv1.2
          # 若网络“卡住不动”，让 git 在低速阈值触发后尽快失败，进入 tarball 兜底（避免 actions/checkout 长时间挂起）。
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: ${{ env.CI_RUNS_ON == 'self-hosted' }}

      - name: Recover workspace when checkout fails (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' && steps.checkout.outcome == 'failure' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "::warning::actions/checkout failed on self-hosted runner; attempting recovery."

          # 1) If the workspace already contains the expected commit, proceed without fetching.
          if [ -d ".git" ]; then
            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            echo "Current HEAD: ${current_sha:-<unknown>}"
            echo "Expected SHA: ${EXPECTED_SHA}"
            if [ -n "${current_sha:-}" ] && [ "$current_sha" = "$EXPECTED_SHA" ]; then
              echo "Workspace already at expected SHA, continue."
              exit 0
            fi
          fi

          # 2) Fallback: download repo tarball via GitHub API (avoids git+gnutls flakiness).
          echo "Falling back to tarball download for ${REPO}@${EXPECTED_SHA} ..."
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          extract_dir="${tmp_dir}/extract"
          mkdir -p "$extract_dir"
          tar -xzf "$tar_path" -C "$extract_dir"

          src_dir="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "${src_dir:-}" ] || [ ! -d "$src_dir" ]; then
            echo "::error::Failed to locate extracted tarball directory"
            exit 1
          fi

          # Replace workspace contents with extracted source.
          shopt -s dotglob
          rm -rf -- *
          mv "$src_dir"/* .
          shopt -u dotglob

          echo "Recovered workspace from tarball."

      - name: Prepare git snapshot (self-hosted fallback)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' && steps.checkout.outcome == 'failure' }}
        run: |
          set -euo pipefail

          # tarball 兜底会移除 .git；部分 CI 校验（docs drift check 等）依赖 `git ls-files`。
          # 这里创建一个“git 快照”（无需 push），确保后续脚本在 fallback 场景也可运行。
          if [ ! -d ".git" ]; then
            git init
            git config user.email "ci@example.invalid"
            git config user.name "CI"
            git add -A
          fi

      - name: Set up Python
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (with cache)
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            frontend/backend/requirements*.txt
            frontend/backend/constraints.txt

      - name: Install dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run Ruff (backend)
        working-directory: frontend/backend
        run: |
          ruff check .

      - name: Verify Python imports
        working-directory: frontend/backend
        run: |
          python -c "from app.core.config import settings; print('Config loaded')"
          python -c "from app.core.database import engine; print('Database module loaded')"
          python -c "from app.core.cache import cache; print('Cache module loaded')"
          python -c "from app.core.exceptions import sanitize_db_error; print('Exceptions module loaded')"
          python -c "import main; print('Main app loaded')"

      - name: Check for syntax errors
        working-directory: frontend/backend
        run: |
          python -m py_compile main.py
          find app -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files have valid syntax"

      - name: Docs drift check (startup commands)
        run: |
          python3 scripts/check_docs_commands.py
          python3 scripts/check_docs_status_markers.py

      - name: Run ETL input checks (unit tests)
        run: |
          python -m pytest -q etl/tests

      - name: Verify ETL sample inputs manifest
        run: |
          python -m etl.input_manifest verify etl/sample_inputs/etl-inputs.manifest.tsv

      - name: Run scripts smoke tests (offline genome assets)
        run: |
          bash scripts/genomes/tests/test_download_igv_assets.sh

      - name: Run scripts unit tests (run-tests.sh)
        run: |
          bash scripts/tests/test_run_tests_frontend_deps.sh
          bash scripts/tests/test_run_tests_backend_deps.sh
          bash scripts/tests/test_check_docs_status_markers.sh

