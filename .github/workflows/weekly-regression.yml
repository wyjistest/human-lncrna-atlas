name: Weekly Regression (Self-hosted)

on:
  # 每周全量回归：默认仅在 self-hosted runner 上运行。
  # 说明：为避免自托管机器资源被占用，schedule 默认不执行；需设置仓库变量 CI_ENABLE_WEEKLY_REGRESSION=true 才会实际跑。
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label override (e.g. ubuntu-latest). Empty = default self-hosted."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege: restrict default GITHUB_TOKEN permissions (security hardening)
permissions:
  actions: read
  contents: read

env:
  CI_RUNS_ON: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || 'self-hosted' }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  ci-plus:
    name: Weekly CI Plus
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CI_ENABLE_WEEKLY_REGRESSION == 'true' }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || 'self-hosted' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          git config --global http.sslVersion tlsv1.2
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout source via tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Prepare git snapshot (self-hosted tarball)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [ ! -d ".git" ]; then
            git init
            git config user.email "ci@example.invalid"
            git config user.name "CI"
            git add -A
          fi

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6
        timeout-minutes: 3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: frontend/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: frontend/web
        run: npx playwright install chromium

      - name: Run ci-plus
        env:
          CI: true
        run: |
          set -euo pipefail
          bash scripts/run-tests.sh ci-plus

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-playwright-report-${{ github.run_id }}
          path: frontend/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: weekly-playwright-test-results-${{ github.run_id }}
          path: frontend/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  perf-overlap:
    name: Weekly Perf Overlap (Docker sample)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CI_ENABLE_WEEKLY_REGRESSION == 'true' }}
    needs: [ci-plus]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || 'self-hosted' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          git config --global http.sslVersion tlsv1.2
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout source via tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6
        timeout-minutes: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run overlap perf regression (docker sample)
        run: |
          set -euo pipefail
          MODE=check bash scripts/baselines/run_overlap_perf_regression_docker.sh

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-perf-overlap-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            docs/reports/perf-overlap-*.md
            docs/reports/perf-overlap-*.json

  perf-genes-regulations:
    name: Weekly Perf Genes/Regulations (Docker sample)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CI_ENABLE_WEEKLY_REGRESSION == 'true' }}
    needs: [perf-overlap]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runs_on) || 'self-hosted' }}
    steps:
      - name: Configure git transport (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global http.version HTTP/1.1
          git config --global http.sslVersion tlsv1.2
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 30

      - name: Checkout source via tarball (self-hosted)
        if: ${{ env.CI_RUNS_ON == 'self-hosted' }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          tar_path="${tmp_dir}/src.tar.gz"
          script_path="${tmp_dir}/checkout_tarball.sh"

          curl -fsSL \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/tarball/${EXPECTED_SHA}" \
            -o "$tar_path"

          tar -xOzf "$tar_path" --wildcards '*/scripts/ci/checkout_tarball.sh' > "$script_path"
          chmod +x "$script_path"

          TARBALL_PATH="$tar_path" WORKSPACE="$GITHUB_WORKSPACE" REPO="$REPO" EXPECTED_SHA="$EXPECTED_SHA" bash "$script_path"

      - name: Checkout code
        if: ${{ env.CI_RUNS_ON != 'self-hosted' }}
        uses: actions/checkout@v6
        timeout-minutes: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run genes/regulations perf regression (docker sample)
        run: |
          set -euo pipefail
          MODE=check bash scripts/baselines/run_genes_regulations_perf_regression_docker.sh

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-perf-genes-regulations-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            docs/reports/perf-genes-regulations-*.md
            docs/reports/perf-genes-regulations-*.json
