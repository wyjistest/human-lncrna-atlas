[pytest]
# ============================================================================
# Human LncRNA Atlas - Pytest Configuration
# Phase 9.20: Test Layer Optimization
# ============================================================================

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
# Usage examples:
#   pytest -m unit                    # 仅单元测试 (无外部依赖)
#   pytest -m integration             # 仅集成测试 (需要数据库/服务器)
#   pytest -m "not slow"              # 跳过慢速测试 (快速开发反馈)
#   pytest -m "unit or integration"   # 单元+集成测试
#   pytest -m performance             # 仅性能测试
markers =
    unit: Pure unit tests - no external dependencies (database, network)
    integration: Integration tests - require running database/server
    performance: Performance benchmarks - may take longer to run
    slow: Tests that take > 5 seconds (use -m "not slow" to skip)

# Default options
# Note: Use -m "not slow" for faster development cycles
addopts = -v --tb=short

# Ignore patterns
norecursedirs = .venv __pycache__ .git

# Async mode (for any async tests)
# Note: This requires pytest-asyncio to be installed
asyncio_mode = auto

# Suppress warning when pytest-asyncio is not loaded
filterwarnings =
    ignore:Unknown config option. asyncio_mode:pytest.PytestConfigWarning

# ============================================================================
# Quick Reference:
# ============================================================================
# Fast development cycle:     pytest -m "not slow"
# Full test suite:            pytest
# Security tests only:        pytest tests/test_security*.py
# Unit tests only:            pytest -m unit
# Skip integration tests:     pytest -m "not integration"
# ============================================================================
